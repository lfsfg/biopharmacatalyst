name: Quarterly Biotech Catalyst Screen

# Fires in the second-to-last week of each calendar quarter and builds the
# candidate list for the NEXT quarter's catalysts.
#
#   17 Mar -> screens for Q2      17 Jun -> screens for Q3
#   17 Sep -> screens for Q4      17 Dec -> screens for Q1 (next year)
#
# The 17th sits inside the second-to-last week of every quarter-ending month,
# leaving ~2 weeks of runway before the quarter turns.

on:
  schedule:
    # 13:30 UTC = 09:30 EDT (Mar/Jun/Sep) / 08:30 EST (Dec)
    - cron: '30 13 17 3,6,9,12 *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Probe the data sources and report health, then stop'
        type: boolean
        default: false
      rank_by:
        description: 'Ranking strategy'
        type: choice
        options: ['tier-then-date', 'date']
        default: 'tier-then-date'
      allow_degraded:
        description: 'Exit 0 even if a required source failed (diagnostics only)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  catalyst-screen:
    runs-on: ubuntu-latest

    concurrency:
      group: catalyst-screen-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      # Parsing regressions are the failure mode that actually bit this
      # project, so the offline suite gates every run.
      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Verify SEC_USER_AGENT is configured
        run: |
          if [ -z "${{ secrets.SEC_USER_AGENT }}" ]; then
            echo "::error::SEC_USER_AGENT secret is not set. SEC requires a real"
            echo "::error::contact string (e.g. 'Jane Doe jane@company.com')."
            echo "::error::Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Run catalyst screener (Stage A)
        env:
          GITHUB_REPO_PATH: ${{ github.workspace }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          RANK_BY: ${{ inputs.rank_by || 'tier-then-date' }}
          ALLOW_DEGRADED: ${{ inputs.allow_degraded && 'true' || 'false' }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python catalyst_screener.py --dry-run
          else
            python catalyst_screener.py
          fi

      # Runs even on failure so a broken run still leaves its diagnostics.
      - name: Upload results as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-screen-${{ github.run_id }}
          path: catalyst_screen/
          retention-days: 90

      - name: Summarise run health
        if: always()
        run: |
          latest=$(ls -1 catalyst_screen/catalyst_manifest_*.json 2>/dev/null | tail -1)
          if [ -n "$latest" ]; then
            {
              echo "### Catalyst screen run health"
              echo '```json'
              cat "$latest"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit and push results
        if: success() && inputs.dry_run != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalyst_screen/
          git diff --staged --quiet && echo "Nothing new to commit." && exit 0
          git commit -m "Quarterly catalyst screen $(TZ=America/New_York date '+%Y-%m-%d') [skip ci]"
          git push
